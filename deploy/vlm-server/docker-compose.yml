# vLLM OpenAI-compatible server for Qwen2.5-VL-7B-Instruct
#
# Run on an Ubuntu + NVIDIA GPU EC2 instance (e.g. g6.xlarge / g5.xlarge).
# The model is auto-pulled from Hugging Face on first container start and
# cached to the mounted volume below, so restarts do NOT re-download it.
#
# Usage:
#   cd deploy/vlm-server
#   docker compose up -d
#   docker compose logs -f      # watch first-run model download progress
#
# Health check once running:
#   curl http://localhost:8000/v1/models
#
# Then point your Replit app's VLM_ENDPOINT_URL at:
#   http://<this-ec2-public-ip>:8000/v1/chat/completions

services:
  vllm-qwen-vl:
    image: vllm/vllm-openai:latest
    container_name: vllm-qwen-vl
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist the Hugging Face model cache across container restarts/reboots.
      - huggingface-cache:/root/.cache/huggingface
    environment:
      # Optional: set if Qwen2.5-VL-7B-Instruct requires gated access on your HF account.
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    command:
      - "--model=Qwen/Qwen2.5-VL-7B-Instruct"
      - "--host=0.0.0.0"
      - "--port=8000"
      - "--gpu-memory-utilization=0.90"
      - "--max-model-len=8192"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    shm_size: '8gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s   # first boot downloads a multi-GB model — give it time

volumes:
  huggingface-cache:
